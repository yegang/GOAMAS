{% extends "admin/change_list.html" %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <style>
        #previewModal .modal-body {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
{% endblock %}

{% block content %}
    {{ block.super }}

    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">预览</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <h4 id="previewTitle"></h4>
                    <div id="previewContent"></div>
                    <hr/>
                    <div id="previewMeta"></div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block footer %}
    {{ block.super }}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".preview-btn").forEach(btn => {
                btn.addEventListener("click", function () {
                    const id = this.dataset.id;

                    fetch(`${id}/preview/`)
                        .then(res => res.json())
                        .then(data => {
                            document.getElementById("previewTitle").innerText = data.title;
                            document.getElementById("previewContent").innerHTML = data.content;
                            document.getElementById("previewMeta").innerHTML =
                                `分类：${data.category} &nbsp;&nbsp; 等级：${data.severity} &nbsp;&nbsp; 时间：${data.created_at}`;

                            $("#previewModal").modal("show");
                        });
                });
            });
        });
    </script>
{% endblock %}
